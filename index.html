<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRACE STORY EDITOR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1015;color:#e9eef3}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:900px;margin:auto;padding:18px 14px 36px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{font-size:24px;font-weight:800;letter-spacing:.12em}.sub{color:#81909e;font-size:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.btn{border:1px solid #344351;background:#17212a;border-radius:8px;padding:9px 12px;min-height:42px}.btn:hover{background:#22303b}.btn.primary{background:#31475a}.board{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:8px 2px 14px}.event{min-width:220px;background:#121a21;border:1px solid #30404d;border-radius:12px;padding:14px;position:relative}.event.selected{border-color:#789ab3;box-shadow:0 0 0 1px #789ab344}.event-num{font-size:11px;color:#71818f}.event-title{font-weight:700;font-size:16px;margin:5px 0 9px}.tag{display:inline-block;font-size:10px;border:1px solid #3a4a57;border-radius:99px;padding:3px 7px;color:#a9b8c4;margin:0 4px 5px 0}.event p{font-size:12px;color:#aeb9c5;line-height:1.45;margin:7px 0}.arrow{align-self:center;color:#667783;font-size:22px;flex:0 0 auto}.empty{border:1px dashed #394956;border-radius:12px;padding:28px;text-align:center;color:#83919c}.add{margin-top:6px}.editor{background:#10171e;border:1px solid #2d3c48;border-radius:12px;padding:15px;display:none}.editor.show{display:block}.editor h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#8e9eaa}.field input,.field textarea,.field select{width:100%;background:#0a1015;border:1px solid #30404c;color:#edf2f7;border-radius:7px;padding:10px;outline:none}.field textarea{min-height:76px;resize:vertical}.editor-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.info{margin-top:16px;color:#71808d;font-size:11px;line-height:1.5}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#17232c;color:#aebdca;margin-right:5px}@media(max-width:600px){.app{padding:14px 10px 30px}.top{align-items:flex-start}.logo{font-size:20px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.event{min-width:205px}.board{padding-bottom:12px}.toolbar .btn{flex:1;min-width:100px}.editor-actions .btn{flex:1}}
</style>
</head>
<body>
<main class="app" id="root">
<header class="top"><div><div class="logo">TRACE</div><div class="sub">STORY EDITOR · BUILD THE STORY BEFORE IT GOES INTO TRACE OS</div></div></header>
<div class="toolbar">
<button class="btn primary" id="addBtn" type="button">＋ ADD EVENT</button>
<button class="btn" id="editBtn" type="button">✏️ EDIT SELECTED</button>
<button class="btn" id="deleteBtn" type="button">🗑 DELETE</button>
<button class="btn" id="upBtn" type="button">↑ MOVE</button>
<button class="btn" id="downBtn" type="button">↓ MOVE</button>
</div>
<section>
<div id="board" class="board" aria-label="Story timeline"></div>
<button class="btn add" id="addBottom" type="button">＋ Add story event at the end</button>
</section>
<section class="editor" id="editor">
<h2 id="editorTitle">Edit story event</h2>
<div class="grid">
<div class="field"><label>EVENT NAME</label><input id="fName" maxlength="60"></div>
<div class="field"><label>APP / PLACE</label><select id="fApp"><option>System</option><option>Files</option><option>Browser</option><option>Notes</option><option>Calculator</option><option>TRACE: RUN</option><option>Maya</option></select></div>
<div class="field full"><label>WHAT HAPPENS?</label><textarea id="fWhat" maxlength="500"></textarea></div>
<div class="field full"><label>WHAT DOES THE PLAYER SEE?</label><textarea id="fNotice" maxlength="500"></textarea></div>
<div class="field full"><label>WHAT CLUE DOES IT GIVE?</label><textarea id="fClue" maxlength="500"></textarea></div>
<div class="field"><label>WHEN?</label><select id="fTime"><option value="0">Right away</option><option value="1">About 1 minute</option><option value="2">About 2 minutes</option><option value="3">About 3 minutes</option><option value="4">About 4 minutes</option><option value="5">About 5 minutes</option><option value="6">About 6 minutes</option><option value="7">About 7 minutes</option><option value="10">About 10 minutes</option></select></div>
<div class="field"><label>STORY PHASE</label><select id="fPhase"><option value="0">Opening</option><option value="1">Discovery</option><option value="2">Maya contact</option><option value="3">Identity reveal</option><option value="4">Ending</option></select></div>
<div class="field full"><label>REQUIRES</label><input id="fRequires" placeholder="Example: Maya has already been discovered" maxlength="120"></div>
</div>
<div class="editor-actions"><button class="btn primary" id="applyBtn" type="button">APPLY CHANGES</button><button class="btn" id="cancelBtn" type="button">CANCEL</button></div>
</section>
<div class="info">
<span class="pill">No official save</span><span class="pill">No TRACE OS changes</span><span class="pill">Build only</span>
<br>Everything here is a temporary story draft in this page. When the story feels right, we can manually put the finished events into the real TRACE OS.
</div>
</main>
<script>
(function(){
const events=[
{id:"identity",name:"Player enters their name",app:"System",time:0,phase:0,what:"TRACE asks what to call the person using the computer.",notice:"Before we begin... What should we call you?",clue:"The opening looks like a normal setup screen, but the wording feels strangely personal.",requires:""},
{id:"strange_file",name:"A strange file appears",app:"Files",time:1,phase:1,what:"A file appears that the player did not create.",notice:"File activity detected.",clue:"Something changed inside the computer without the player doing it.",requires:"Player has entered their name"},
{id:"maya_reference",name:"Maya is mentioned",app:"Browser",time:2,phase:1,what:"A local article introduces Maya Reyes and the missing-person case.",notice:"A local record mentions Maya Reyes.",clue:"Maya is connected to TRACE-143207 and a timestamp from today.",requires:"The strange file appeared"},
{id:"record_mismatch",name:"Records contradict each other",app:"Files",time:3,phase:1,what:"Two records disagree about who the current user is.",notice:"Session record mismatch detected.",clue:"The computer has two pieces of information that should not both be true.",requires:"Maya has been mentioned"},
{id:"run_change",name:"TRACE: RUN changes",app:"TRACE: RUN",time:4,phase:1,what:"The game begins reacting to information from the hidden records.",notice:"TRACE: RUN accessed archived session data.",clue:"The game is reading data from somewhere it should not have access to.",requires:"The records contradict"},
{id:"maya_contact",name:"Maya contacts the session",app:"Maya",time:7,phase:2,what:"A second consciousness reaches the player through TRACE.",notice:"I know you're there.",clue:"Maya recognizes the player before the player remembers her.",requires:"TRACE: RUN accessed the archive"}
];
let selected=0,editing=-1;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;"}[c]));}
function render(){
 const board=$("board");
 if(!events.length){board.innerHTML='<div class="empty">No story events yet.<br>Press ＋ ADD EVENT to start building.</div>';return}
 board.innerHTML=events.map((e,i)=>'<button type="button" class="event '+(i===selected?'selected':'')+'" data-i="'+i+'"><div class="event-num">STEP '+(i+1)+' · '+esc(e.time===0?"START":e.time+" MIN")+'</div><div class="event-title">'+esc(e.name)+'</div><span class="tag">'+esc(e.app)+'</span><span class="tag">'+esc(["Opening","Discovery","Maya contact","Identity reveal","Ending"][e.phase]||"Story")+'</span><p><b>Happens:</b> '+esc(e.what)+'</p><p><b>Player sees:</b> '+esc(e.notice)+'</p><p><b>Clue:</b> '+esc(e.clue)+'</p></button>'+ (i<events.length-1?'<div class="arrow">→</div>':'')).join("");
 board.querySelectorAll(".event").forEach(b=>b.addEventListener("click",()=>{selected=Number(b.dataset.i);render()}));
}
function openEditor(i){
 if(i<0||i>=events.length)return;
 editing=i; const e=events[i];
 $("editorTitle").textContent="Edit: "+e.name;
 $("fName").value=e.name;$("fApp").value=e.app;$("fWhat").value=e.what;$("fNotice").value=e.notice;$("fClue").value=e.clue;
 $("fTime").value=String(e.time);$("fPhase").value=String(e.phase);$("fRequires").value=e.requires;
 $("editor").classList.add("show");$("fName").focus();
}
function newEvent(){
 events.push({id:"event_"+Date.now(),name:"New story event",app:"System",time:1,phase:1,what:"Describe what happens.",notice:"Describe what the player sees.",clue:"Describe what this tells the player.",requires:""});
 selected=events.length-1;render();openEditor(selected);
}
function apply(){
 if(editing<0)return;
 const e=events[editing];
 e.name=$("fName").value.trim()||"Untitled event";e.app=$("fApp").value;e.what=$("fWhat").value.trim()||"Something happens.";e.notice=$("fNotice").value.trim()||"The player notices something.";e.clue=$("fClue").value.trim()||"A clue is revealed.";e.time=Number($("fTime").value)||0;e.phase=Number($("fPhase").value)||0;e.requires=$("fRequires").value.trim();
 selected=editing;editing=-1;$("editor").classList.remove("show");render();
}
function cancel(){editing=-1;$("editor").classList.remove("show")}
$("addBtn").addEventListener("click",newEvent);$("addBottom").addEventListener("click",newEvent);
$("editBtn").addEventListener("click",()=>openEditor(selected));
$("deleteBtn").addEventListener("click",()=>{if(selected<0||!events.length)return;events.splice(selected,1);selected=Math.max(0,Math.min(selected,events.length-1));cancel();render()});
$("upBtn").addEventListener("click",()=>{if(selected>0){[events[selected-1],events[selected]]=[events[selected],events[selected-1]];selected--;render()}});
$("downBtn").addEventListener("click",()=>{if(selected>=0&&selected<events.length-1){[events[selected+1],events[selected]]=[events[selected],events[selected+1]];selected++;render()}});
$("applyBtn").addEventListener("click",apply);$("cancelBtn").addEventListener("click",cancel);
render();
})();
</script>
</body>
</html>
